        <!-- 右侧内容区 -->
        <div class="right-section">
            <h1 class="right-title"><em>展示图片</em></h1>
            <div class="image-gallery">
                <img src="static/home_picture/gate_of_school.png" alt="展示图片">
                <img src="static/home_picture/logo.png" alt="展示图片">
            </div>

            <!-- 年份导航栏 -->
            <div class="nav-container" id="yearNav">
                <!-- 年份按钮将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>
</div>
<script>
    fetch('static/home_video/video.json')
        .then(response => response.json())
        .then(data => {
            const mainVideo = document.getElementById('main-video');
            const currentTitle = document.getElementById('current-title');
            const playlist = document.getElementById('playlist');

            currentTitle.textContent = "选择视频播放";
            playlist.innerHTML = '';

            data.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.textContent = video.name;

                item.addEventListener('click', () => {
                    mainVideo.src = video.path;
                    currentTitle.textContent = video.name;
                    mainVideo.play();
                });
                playlist.appendChild(item);

                // 如果不是最后一个元素，则添加<br>标签
                if (index < data.length - 1) {
                    const br = document.createElement('br');
                    playlist.appendChild(br);
                }
            });

            if(data.length > 0) {
                mainVideo.src = data[0].path;
                currentTitle.textContent = data[0].name;
            }
        })
        .catch(error => {
            console.error('加载JSON失败:', error);
            document.getElementById('player').innerHTML =
                '<p style="color:red">视频加载失败，请检查videos.json文件</p>';
        });
</script>
<script src="static/js/script.js"></script>
</body>
