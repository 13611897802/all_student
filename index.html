<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>往届学生展示</title>
    <link rel="stylesheet" href="static/css/fontawesome-free-6.7.2-web/fontawesome-free-6.7.2-web/css/all.css">
     <link rel="stylesheet" href="static/css/styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" sizes="16x16">
</head>
<body>
<div class="container">
    <!-- 顶部标题 -->
    <h1 class="main-title"><em>这里永不关停，随时来看！</em></h1>

    <div class="content-wrapper">
        <!-- 左侧视频区 -->
        <div class="left-section">
            <div class="video-container">
                <p class="video-title"><em>Test Video</em></p>
                <video controls width="100%" height="auto" playsinline muted>
                    <source src="static/home_video/video.mp4" type="video/mp4">
                    <source src="static/home_video/video.webm" type="video/webm">
                    <p>您的设备不支持HTML5视频，请下载<a href="static/home_video/video.mp4">MP4视频</a></p>
                </video>
            </div>
            <div class="video-container">
                <p class="video-title"><em>Test Video</em></p>
                <video controls width="100%" height="auto" playsinline muted>
                    <source src="static/home_video/video.mp4" type="video/mp4">
                    <source src="static/home_video/video.webm" type="video/webm">
                    <p>您的设备不支持HTML5视频，请下载<a href="static/home_video/video.mp4">MP4视频</a></p>
                </video>
            </div>
        </div>

        <!-- 右侧内容区 -->
        <div class="right-section">
            <h1 class="right-title"><em>展示图片</em></h1>
            <div class="image-gallery">
                <img src="static/home_picture/gate_of_school.png" alt="展示图片">
                <img src="static/home_picture/logo.png" alt="展示图片">
            </div>

            <!-- 年份导航栏 -->
            <div class="nav-container" id="yearNav">
                <!-- 年份按钮将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>
</div>

<script src="static/js/script.js"></script>
</body>
</html>
